name: smartspot
description: SmartSpot - smart location-based reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local database (offline-first storage)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Backend API communication
  http: ^1.2.1

  # Auth token / small key-value storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Location & maps
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Charts (analytics screen)
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
